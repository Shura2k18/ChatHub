version: "3.8"

services:
  server:
    build:
      context: ./server
      target: prod
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mongo
#      - client
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URL=mongodb://mongo:27017/ChatDB
    volumes:
      - ./server:/app
    command: ["npm", "start"]

  client:
    build:
      context: ./client
      target: prod
    ports:
      - "80:80"

#  client:
