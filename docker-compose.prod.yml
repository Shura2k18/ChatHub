#       - caddy_config:/config
#       - ./client/build:/usr/share/caddy/html
#    networks:
#      - app_network

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    ports:
      - "6379:6379"

